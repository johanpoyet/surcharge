<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Surcharge – Exercice, type de suivi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,700;1,800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0A0A0A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0A0A0A; color: #F5F5F0; font-family: 'Barlow', sans-serif; padding: 52px 20px 32px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="#" style="height: 44px; display: flex; align-items: center; color: #9A9A92; text-decoration: none; font-weight: 600; font-size: 15px">Annuler</a>
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #9A9A92">Nouvel exercice</div>
    <button style="height: 44px; padding: 0; border: none; background: transparent; color: #D7FF3A; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 15px">Enregistrer</button>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9A92">Nom de l'exercice
    <input value="Fractionné 400 m" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1.5px solid #D7FF3A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 17px; text-transform: none; letter-spacing: 0">
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9A92">Ce que tu notes à chaque série</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button aria-pressed="false" style="height: 72px; border-radius: 14px; border: 1px solid #2A2A2A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Charge × reps</span><span style="display: block; font-size: 12px; color: #9A9A92">82,5 kg × 8</span></button>
      <button aria-pressed="true" style="height: 72px; border-radius: 14px; border: 1.5px solid #D7FF3A; background: rgba(215,255,58,0.08); color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Distance + temps</span><span style="display: block; font-size: 12px; color: #D7FF3A">400 m en 1:32 · allure auto</span></button>
      <button aria-pressed="false" style="height: 72px; border-radius: 14px; border: 1px solid #2A2A2A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Temps seul</span><span style="display: block; font-size: 12px; color: #9A9A92">Gainage 1:30</span></button>
      <button aria-pressed="false" style="height: 72px; border-radius: 14px; border: 1px solid #2A2A2A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Reps seules</span><span style="display: block; font-size: 12px; color: #9A9A92">Tractions × 12</span></button>
      <button aria-pressed="false" style="height: 72px; border-radius: 14px; border: 1px solid #2A2A2A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Calories</span><span style="display: block; font-size: 12px; color: #9A9A92">Assault bike 20 cal</span></button>
      <button aria-pressed="false" style="height: 72px; border-radius: 14px; border: 1px solid #2A2A2A; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; text-align: left; padding: 0 12px"><span style="display: block; font-weight: 700; font-size: 15px">Charge + distance</span><span style="display: block; font-size: 12px; color: #9A9A92">Farmers 2×24 kg, 200 m</span></button>
    </div>
  </div>

  <div style="border-radius: 16px; background: #151515; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9A92">Aperçu en séance</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="height: 56px; border-radius: 12px; background: #0A0A0A; border: 1px solid #2A2A2A; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 5px">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #1F1F1F; display: flex; align-items: center; justify-content: center; font-size: 20px">−</span>
        <span style="text-align: center"><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px; line-height: 1">400</span><span style="display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #9A9A92">MÈTRES</span></span>
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #D7FF3A; color: #0A0A0A; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">+</span>
      </div>
      <div style="height: 56px; border-radius: 12px; background: #0A0A0A; border: 1px solid #2A2A2A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D7FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 3h6"></path></svg>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 24px">1:32</span>
      </div>
    </div>
    <div style="font-size: 13px; color: #9A9A92">Le chrono démarre et s'arrête d'un tap. Allure calculée : <b style="color: #F5F5F0">3:50 /km</b></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9A9A92">Discipline</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 1px solid #2A2A2A; border-radius: 10px; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Muscu</button>
      <button aria-pressed="true" style="height: 38px; padding: 0 14px; border: none; border-radius: 10px; background: #D7FF3A; color: #0A0A0A; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 14px">Course</button>
      <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 1px solid #2A2A2A; border-radius: 10px; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Cross-training</button>
      <button aria-pressed="false" style="height: 38px; padding: 0 14px; border: 1px solid #2A2A2A; border-radius: 10px; background: #151515; color: #F5F5F0; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Hyrox</button>
    </div>
  </div>
</div>
</x-dc>
