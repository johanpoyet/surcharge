# johanpoyet.fr : pages publiques de Surcharge (et portfolio à venir à la racine).
# Copie de /etc/nginx/sites-available/johanpoyet.fr sur le VPS (parties HTTPS ajoutées par certbot).
server {
    server_name johanpoyet.fr www.johanpoyet.fr;

    root /home/ubuntu/sites/johanpoyet.fr;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # En attendant le portfolio : la racine mène à l assistance de Surcharge.
    location = / {
        return 302 /surcharge/support;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/johanpoyet.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/johanpoyet.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.johanpoyet.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = johanpoyet.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name johanpoyet.fr www.johanpoyet.fr;
    return 404; # managed by Certbot




}